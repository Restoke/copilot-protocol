# Example: add this job to your server repo's CI workflow.
# It validates that the server emits legal protocol transcripts.

name: server-contracts

on:
  push:
  pull_request:

jobs:
  protocol-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pip install copilot-protocol
      - run: pytest tests/protocol_contracts -v
