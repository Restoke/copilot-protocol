[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-protocol"
version = "1.0.0"
description = "Copilot Streaming Protocol validators and fixtures"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
